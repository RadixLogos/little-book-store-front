<div class="container-fluid">
  <div class="row">

    <!-- MENU LATERAL -->
    <div class="col-md-12 bg-dark vh-100 p-3">

      <h5>📂 Menu</h5>

      <!-- Botão para Catálogo -->
      <div class="mt-3">
        <button 
          class="btn btn-outline-primary w-100"
          (click)="openScreen('books')">
          📚 Catálogo
        </button>
      </div>

      <!-- Botão para Pedidos -->
      <div class="mt-2">
        <button 
          class="btn btn-outline-info w-100"
          (click)="openScreen('buy-orders')">
          📋 Vendas Realizadas
        </button>
      </div>

      <!-- Dropdown de cadastros -->
      <div class="mt-1">
        <button 
          class="btn btn-outline-secondary w-100"
          (click)="toggleCadastros()">
          Cadastros ▼
        </button>

        <div *ngIf="mostrarCadastros" class="mt-2">
          <button class="btn btn-link w-100 text-start" (click)="openScreen('/book-register')">Cadastrar Livros</button>
          <br>
          <button class="btn btn-link w-100 text-start" (click)="openScreen('/client-selector')">Cadastrar Vendas</button>
          <br>
          <button class="btn btn-link w-100 text-start" (click)="openScreen('/client-selector-general')">Cadastrar Clientes</button>
          <br>
          <button class="btn btn-link w-100 text-start" (click)="openScreen('/editor-register')">Editoras</button>
          <br>
          <button class="btn btn-link w-100 text-start" (click)="openScreen('/genre-register')">Generos</button>
        </div>
      </div>
      <div class="mt-2">
        <button class="btn btn-outline-success w-100" (click)="openScreen('login')">
          Login ➜]
        </button>
      </div>
    </div>
  </div>
</div>
