
<div class="container mt-4" >

  <!-- Cabeçalho -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Venda de Livros</h2>
    <button class="btn btn-outline-secondary" type="button" (click)="voltarPagina()">
      Voltar
    </button>
  </div>

 
  <!-- Busca -->
  <div class="input-group mb-4">
    <input 
      type="text"
      class="form-control"
      [(ngModel)]="bookFilter.name"
      placeholder="Buscar por nome...">

    <button class="btn btn-outline-secondary" (click)="loadBooks()">
      Buscar
    </button>
  </div>
  <!-- GRID DE LIVROS -->
 
  <div class="row">

    <div class="col-md-3 mb-4" *ngFor="let book of books">
      <div class="card h-100 shadow-sm" (click)="selectBook(book)" style="cursor: pointer;">

        <!-- Imagem -->
        <img 
          [src]="book.imgUrl" 
          class="card-img-top"
          style="height: 250px; object-fit: cover;">

        <!-- Conteúdo -->
        <div class="card-body d-flex flex-column">

          <h5 class="card-title">{{ book.name }}</h5>

          <p class="card-text mb-1">
            💰 R$ {{ book.price | number:'1.2-2' }}
          </p>

          <p class="card-text text-muted">
            Estoque: {{ book.stockQuantity }}
          </p>

          <button class="btn btn-outline-primary mt-auto" type="button">
            Selecionar para venda
          </button>

        </div>

      </div>
    </div>

  </div>

  <div class="sale-modal-backdrop" *ngIf="showSaleBox && selectedBook.id" (click)="closeSaleBox()">
    <div class="sale-modal-dialog" (click)="$event.stopPropagation()">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <div>
            <h4 class="mb-0">Venda de: {{ selectedBook.name }}</h4>
            <small class="text-muted">Preço base: R$ {{ selectedBook.price | number:'1.2-2' }} | Estoque: {{ selectedBook.stockQuantity }}</small>
          </div>
          <button type="button" class="btn-close" aria-label="Fechar" (click)="closeSaleBox()"></button>
        </div>

        <div class="card-body">
          <div class="row gy-3">
            <div class="col-md-12">
              <label class="form-label">Quantidade</label>
              <input
                type="number"
                class="form-control"
                [(ngModel)]="quantity"
                min="1"
                [max]="selectedBook.stockQuantity"
                (change)="selectQuantity(quantity)">
            </div>
          </div>

          <div class="row gy-3 mt-2">
            <div class="col-md-6">
              <label class="form-label">📱 Valor vendido em PIX</label>
              <input
                type="number"
                class="form-control"
                [(ngModel)]="pixValue"
                min="0"
                step="0.01"
                placeholder="Valor em PIX">
            </div>

            <div class="col-md-6">
              <label class="form-label">💵 Valor vendido em Dinheiro</label>
              <input
                type="number"
                class="form-control"
                [(ngModel)]="moneyValue"
                min="0"
                step="0.01"
                placeholder="Valor em Dinheiro">
            </div>
          </div>

          <div class="mt-4 d-flex flex-wrap gap-2">
            <button class="btn btn-success" type="button" (click)="registerSale()">
              Registrar venda
            </button>
            <button class="btn btn-secondary" type="button" (click)="closeSaleBox()">
              Fechar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Botões -->
      <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-secondary" (click)="finalizeSale()">
          Finalizar Venda
        </button>
</div>





<!-- Modal de Sucesso/Erro -->
<app-modal-alert 
  [isOpen]="isModalOpen"
  [type]="modalType"
  [title]="modalTitle"
  [message]="modalMessage"
  (onClose)="closeModal()">
</app-modal-alert>
