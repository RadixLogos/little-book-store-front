<!-- Inputs -->
  

<div class="container mt-4">
  <div class="row justify-content-center">

    <div class="col-md-12">
      <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Cadastro de Gêneros</h2>
    </div>
        <div class="row mb-3">
        <div class="col-md-12">
          <div class="d-flex gap-2">
            <input 
          class="form-control"
          type="text"
          (keydown.enter)="saveGenre()"
          [(ngModel)]="genreName" 
          placeholder="Nome do gênero">
        <button class="btn btn-primary" (click)="saveGenre()">
          Salvar
        </button>
          </div>
          
        </div>
          
        
      </div>
      <div class="card shadow">
        <div class="card-header">
          <h4 class="mb-0">Lista de Gêneros</h4>
        </div>

        <div class="card-body">

          <ul class="list-group">
            <li
              class="list-group-item"
              *ngFor="let genre of genreList">

              {{ genre.name }}

            </li>
          </ul>

        </div>
      </div>

    </div>

  </div>
</div>
      <!-- Botões -->
      <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-secondary" (click)="voltarPagina()">
          Voltar
        </button>

      </div>
