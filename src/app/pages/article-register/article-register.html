 <!-- Inputs -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Cadastro de Artigos</h2>
    </div>
      <div class="mb-3">
        <input 
          class="form-control"
          [(ngModel)]="articleSelected.name"  
          placeholder="Nome do artigo">
      </div>

        <div class="mb-3">
        <input 
          type="number"
          class="form-control"
          [(ngModel)]="articleSelected.price" 
          placeholder="Preço do artigo">
      </div>

      <div class="mb-3">
        <input 
          type="number"
          class="form-control"
          [(ngModel)]="articleSelected.stockQuantity" 
          placeholder="Quantidade em estoque">
      </div>


      <div class="mb-3">
        <input 
          #fileInput
          type="file"
          class="form-control"
          (change)="onFileSelected($event)">
      </div>

      <!-- Botões -->
      <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-secondary" (click)="voltarPagina()">
          Voltar
        </button>

        <button class="btn btn-primary" (click)="saveArticle()">
          Salvar
        </button>
      </div>
