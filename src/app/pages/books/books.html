
<div class="container mt-4">

  <!-- Cabeçalho -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>📚 Catálogo de Livros</h2>
  </div>

  <!-- Filtros -->
  <div class="card mb-4">
    <div class="card-body">
      <div class="row g-3">
        <!-- Busca por nome -->
        <div class="col-md-4">
          <label class="form-label">Buscar por nome</label>
          <div class="input-group">
            <input
              type="text"
              class="form-control"
              [(ngModel)]="bookFilter.name"
              placeholder="Digite o nome..."
            />
          </div>
        </div>

        <!-- Filtro por gênero -->
        <div class="col-md-4">
          <label class="form-label">Gênero</label>
          <select
            class="form-select"
            [(ngModel)]="genreId"
            (change)="loadBooks()"
            >
            <option value="">Todos os gêneros</option>
            <option *ngFor="let genre of genres" [value]="genre.id">
              {{ genre.name }}
            </option>
          </select>
        </div>

        <!-- Filtro por editora -->
        <div class="col-md-4">
          <label class="form-label">Editora</label>
          <select
            class="form-select"
            [(ngModel)]="editorId"
            (change)="loadBooks()"
            >
            <option value="">Todas as editoras</option>
            <option *ngFor="let editor of editors" [value]="editor.id">
              {{ editor.name }}
            </option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- GRID DE LIVROS -->

  <div class="row">

    <div class="col-md-3 mb-4" *ngFor="let book of books">
      <div class="card h-100 shadow-sm" [class.unavailable]="isUnavailable(book)">

        <!-- Imagem -->
        <div class="image-container">
        <img
  [src]="book.imgUrl"
  class="card-img-top"
  (click)="openImage(book.imgUrl)"
  [style.filter]="isUnavailable(book) ? 'grayscale(100%)' : 'none'"
  [style.opacity]="isUnavailable(book) ? '0.6' : '1'"
  style="height: 250px; object-fit: contain; background-color: #f8f9fa; cursor: pointer;"
  [alt]="book.name"
/>


          <div *ngIf="isUnavailable(book)" class="badge-overlay">
            <span class="badge bg-danger">INDISPONÍVEL</span>
          </div>
        </div>

        <!-- Conteúdo -->
        <div class="card-body d-flex flex-column">

          <h5 class="card-title">{{ book.name }}</h5>
          
          <p class="card-text mb-1 text-muted big" style="font-size: 1.25rem;">
            {{ book.editor.name }}
          </p>
          

          <p class="card-text mb-1">
            💰 R$ {{ book.price | number:'1.2-2' }}
          </p>

          <p class="card-text text-muted">
            Estoque: <span [class]="isUnavailable(book) ? 'text-danger' : 'text-success'">
              {{ isUnavailable(book) ? 'Indisponível' : book.stockQuantity }}
            </span>
          </p>

          <!-- Botões -->
          <button
            class="btn btn-outline-primary mt-auto"
            (click)="viewDetails(book)"
          >
            Ver detalhes
          </button>
          <br>
          <button
            class="btn btn-outline-primary"
            (click)="sendBook(book)"
          >
            Atualizar
          </button>
          <br>
          <button
            class="btn btn-outline-danger mt-2"
            (click)="deleteBook(book)"
          >
            Deletar
          </button>
      </div>
       
     
    </div>

  </div>

  <!-- Mensagem quando nenhum livro é encontrado -->
  <div *ngIf="books.length === 0" class="alert alert-info text-center mt-4">
    Nenhum livro encontrado com os filtros aplicados.
  </div>

</div>

<div class="image-modal" *ngIf="selectedImage" (click)="closeImage()">
  <img [src]="selectedImage" class="image-modal-content" />
</div>
