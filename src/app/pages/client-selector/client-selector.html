<div class="container mt-4">
  <!-- Cabeçalho -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Selecionar Cliente</h2>
    <button class="btn btn-outline-secondary" type="button" (click)="voltarPagina()">
      Voltar
    </button>
  </div>

  <!-- Seletor de Clientes -->
  <div class="row">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">👥 Clientes Disponíveis</h5>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>
                    <input 
                      type="radio" 
                      name="client" 
                      [value]="null"
                      [(ngModel)]="selectedClientId"
                      disabled>
                    Selecionar
                  </th>
                  <th>Nome</th>
                  <th>Email</th>
                  <th>Telefone</th>
                </tr>
              </thead>
              <tbody *ngIf="clients.length > 0">
                <tr  *ngFor="let client of clients" [class.table-active]="selectedClientId === client.id">
                  <td>
                    <input 
                      type="radio" 
                      name="client" 
                      [value]="client.id"
                      [(ngModel)]="selectedClientId">
                  </td>
                  <td>{{ client.name }}</td>
                  <!-- <td>{{ client.email || '-' }}</td> -->
                  <td>{{ client.cellphone || '-' }}</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div *ngIf="clients.length === 0" class="alert alert-info">
            Nenhum cliente disponível. Cadastre um novo cliente para continuar.
          </div>

          <div class="d-flex gap-2 mt-3">
            <button 
              class="btn btn-success" 
              type="button" 
              (click)="selectClient()"
              [disabled]="!selectedClientId">
              Continuar com Cliente Selecionado
            </button>
            <button 
              class="btn btn-success" 
              type="button" 
              (click)="noClientSelected()">
              Continuar sem Cliente
            </button>
            <button 
              class="btn btn-outline-primary" 
              type="button" 
              (click)="toggleRegisterForm()">
              {{ showRegisterForm ? '✕ Cancelar' : '➕ Cadastrar Novo Cliente' }}
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Formulário de Cadastro -->
    <div class="col-md-4" *ngIf="showRegisterForm">
      <div class="card border-primary">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Novo Cliente</h5>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Nome *</label>
            <input 
              type="text" 
              class="form-control" 
              [(ngModel)]="newClientName"
              placeholder="Nome completo">
          </div>

          <!-- <div class="mb-3">
            <label class="form-label">Email</label>
            <input 
              type="email" 
              class="form-control" 
              [(ngModel)]="newClientEmail"
              placeholder="email@exemplo.com">
          </div> -->

          <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input 
              type="tel" 
              class="form-control" 
              [(ngModel)]="newClientPhone"
              placeholder="(11) 99999-9999">
          </div>

          <!-- <div class="mb-3">
            <label class="form-label">CPF</label>
            <input 
              type="text" 
              class="form-control" 
              [(ngModel)]="newClientCpf"
              placeholder="000.000.000-00">
          </div> -->

          <button 
            class="btn btn-primary w-100" 
            type="button" 
            (click)="registerNewClient()">
            Cadastrar Cliente
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal de Sucesso/Erro -->
<app-modal-alert 
  [isOpen]="isModalOpen"
  [type]="modalType"
  [title]="modalTitle"
  [message]="modalMessage"
  (onClose)="closeModal()">
</app-modal-alert>
