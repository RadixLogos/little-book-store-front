 <!-- Inputs -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Cadastro de Livros</h2>
    </div>
      <div class="mb-3">
        <input 
          class="form-control"
          [(ngModel)]="bookSelected.name"  
          placeholder="Nome do livro">
      </div>

      <div class="mb-3">
       <select
         class="form-select"
         [(ngModel)]="selectedEditor"
         >
         <option *ngIf="selectedEditor == undefined" [ngValue]="null" disabled>Selecione um editora</option>
         <option *ngIf="selectedEditor != undefined" [ngValue]="selectedEditor">{{selectedEditor.name}}</option>
         <option *ngFor="let editor of editors" [ngValue]="editor">
           {{editor.name}}
         </option>
       </select>
      </div>


      <div class="mb-3" *ngFor="let genre of genres">
        <input type="checkbox" (change)="toggleGenre($event,genre)">
        {{genre.name}}
      </div>
     
     

        <div class="mb-3">
        <input 
          class="form-control"
          [(ngModel)]="bookSelected.author" 
          placeholder="Nome do autor">
      </div>

          <div class="mb-3">
      <textarea 
        class="form-control"
        [(ngModel)]="bookSelected.description" 
        placeholder="Descrição do livro"
        rows="5">
      </textarea>
    </div>

      <div class="mb-3">
        <input 
          type="number"
          class="form-control"
          [(ngModel)]="bookSelected.price" 
          placeholder="Preço do livro">
      </div>

      <div class="mb-3">
        <input 
          type="number"
          class="form-control"
          [(ngModel)]="bookSelected.stockQuantity" 
          placeholder="Quantidade em estoque">
      </div>


      <div class="mb-3">
        <input 
          #fileInput
          type="file"
          class="form-control"
          (change)="onFileSelected($event)">
      </div>

      <!-- Botões -->
      <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-secondary" (click)="voltarPagina()">
          Voltar
        </button>

        <button class="btn btn-primary" (click)="saveBook()">
          Salvar
        </button>
      </div>
