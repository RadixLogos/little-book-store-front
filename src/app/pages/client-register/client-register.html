</div>

<div class="mb-3">
  <input 
    class="form-control"
    [(ngModel)]="clientSelected.name"  
    placeholder="Nome do cliente">
</div>

<div class="mb-3">

    placeholder="Telefone">
</div>

<div class="d-flex justify-content-between mt-4">
