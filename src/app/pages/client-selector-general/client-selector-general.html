<div class="container mt-4">
  <!-- Cabeçalho -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Selecionar Cliente</h2>
    <button class="btn btn-outline-secondary" type="button" (click)="voltarPagina()">
      Voltar
    </button>
  </div>

  <!-- Seletor de Clientes -->
  <div class="row">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">👥 Clientes Cadastrados</h5>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Telefone</th>
                  <th>Ações</th>
                  
                </tr>
              </thead>
              <tbody *ngIf="clients.length > 0">
                <tr  *ngFor="let client of clients" [class.table-active]="selectedClientId === client.id">
                  <td>{{ client.name }}</td>
                  <td>{{ client.cellphone || '-' }}</td>
                  <td>
                    <button 
                      class="btn btn-warning"
                      (click)="startEdit(client)">
                      Editar
                    </button>
                    <button 
                      class="btn btn-danger ms-2"
                      (click)="deleteClient(client)">
                      Excluir
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div *ngIf="clients.length === 0" class="alert alert-info">
            Nenhum cliente disponível. Cadastre um novo cliente para continuar.
          </div>

          <div class="mt-3">
          
            <button 
              class="btn btn-outline-primary" 
              type="button" 
              (click)="toggleRegisterForm()">
              {{ showRegisterForm ? '✕ Cancelar' : '➕ Cadastrar Novo Cliente' }}
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Formulário de Cadastro -->
    <div class="col-md-4" *ngIf="showRegisterForm">
      <div class="card border-primary">
        <div class="card-header bg-primary text-white">
          <h5 *ngIf="!editMode" class="mb-0">Novo Cliente</h5>
          <h5 *ngIf="editMode" class="mb-0">Editar Cliente</h5>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Nome *</label>
            <input 
              type="text" 
              class="form-control" 
              [(ngModel)]="newClientName"
              placeholder="Nome completo">
          </div>

          <!-- <div class="mb-3">
            <label class="form-label">Email</label>
            <input 
              type="email" 
              class="form-control" 
              [(ngModel)]="newClientEmail"
              placeholder="email@exemplo.com">
          </div> -->

          <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input 
              type="tel" 
              class="form-control" 
              [(ngModel)]="newClientPhone"
              placeholder="(11) 99999-9999">
          </div>

          <!-- <div class="mb-3">
            <label class="form-label">CPF</label>
            <input 
              type="text" 
              class="form-control" 
              [(ngModel)]="newClientCpf"
              placeholder="000.000.000-00">
          </div> -->

            <button *ngIf="!editMode"
              class="btn btn-primary w-100" 
              type="button" 
              (click)="registerNewClient()">
              Cadastrar Cliente
            </button>
            <button *ngIf="editMode"
              class="btn btn-primary w-100" 
              type="button" 
              (click)="updateClient()">
              Atualizar Cliente
            </button>

        </div>
      </div>
    </div>
  
  
  </div>
</div>

<!-- Modal de Sucesso/Erro -->
<app-modal-alert 
  [isOpen]="isModalOpen"
  [type]="modalType"
  [title]="modalTitle"
  [message]="modalMessage"
  (onClose)="closeModal()">
</app-modal-alert>
